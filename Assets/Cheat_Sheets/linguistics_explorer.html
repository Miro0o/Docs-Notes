 /* ── Cell interactions ── */

               box-shadow 0.25s cubic-bezier(.4,0,.2,1),
               filter 0.25s ease;
 }
 .cell.filled:hover {

 }
 .cell.filled:active {

 }

   box-shadow: 0 0 0 2.5px var(--ring), 0 12px 32px rgba(0,0,0,0.10) !important;
   transform: translateY(-2px);
   z-index: 11;
 }

 /* ── Axis pills ── */
 .pill {
   transition: all 0.2s ease;
   border: 1.5px solid var(--border);
   outline: none;
   font-family: var(--sans);
 }
 .pill:not(:disabled):not(.on):hover {
   background: var(--text) !important;
   color: #fff !important;
   border-color: var(--text) !important;
 }
 .pill.on {
   background: var(--text) !important;
   color: #fff !important;
   border-color: var(--text) !important;
 }

 /* ── Swap ── */
 .swap {
   transition: all 0.3s cubic-bezier(.4,0,.2,1);
   border: 1.5px solid var(--border);
   outline: none;
 }
 .swap:hover {
   background: var(--text) !important;
   color: #fff !important;
   border-color: var(--text) !important;
   transform: rotate(180deg);
 }

 /* ── Stagger reveal ── */
 @keyframes pop {
   from { opacity: 0; transform: translateY(10px) scale(0.97); }
   to { opacity: 1; transform: translateY(0) scale(1); }
 }

 /* ── Scrollbar ── */
 .scroll::-webkit-scrollbar { height: 5px; }
 .scroll::-webkit-scrollbar-track { background: transparent; }
 .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── helper: hex → rgba ── */
const rgba = (hex, a) => {
 const r = parseInt(hex.slice(1,3),16);
 const g = parseInt(hex.slice(3,5),16);
 const b = parseInt(hex.slice(5,7),16);
 return `rgba(${r},${g},${b},${a})`;
};

// ═══════════════════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════════════════

const PersonIcon = ({ color }) => (
 <svg width="11" height="13" viewBox="0 0 11 13" fill="none" style={{ flexShrink: 0, marginRight: 5, marginTop: 1 }}>
   <circle cx="5.5" cy="3.2" r="2.6" fill={color} />
   <path d="M0.7 13C0.7 9.8 2.6 7.5 5.5 7.5C8.4 7.5 10.3 9.8 10.3 13" fill={color} />
 </svg>
);

function App() {
 const [xAxis, setXAxis] = useState("level");
 const [yAxis, setYAxis] = useState("interface");
 const [selectedCell, setSelectedCell] = useState(null);
 const [tick, setTick] = useState(0);

 const xDim = DIMENSIONS[xAxis];
 const yDim = DIMENSIONS[yAxis];

 const getCell = useCallback((xId, yId) => {
   return CELLS[`${xId}+${yId}`] || CELLS[`${yId}+${xId}`] || null;
 }, []);

 const sw = (axis, v) => {
   if (axis === 'x') { if (v === yAxis) setYAxis(xAxis); setXAxis(v); }
   else { if (v === xAxis) setXAxis(yAxis); setYAxis(v); }
   setSelectedCell(null);
   setTick(t => t + 1);
 };

 const total = xDim.items.length * yDim.items.length;
 const filled = xDim.items.reduce((a, xi) =>
   a + yDim.items.filter(yi => getCell(xi.id, yi.id)).length, 0);

 return (
   <div style={{ padding: '44px 28px 36px', maxWidth: 1520, margin: '0 auto' }}>

     {/* ─── Header ─── */}
     <header style={{ textAlign: 'center', marginBottom: 32 }}>
       <h1 style={{
         fontFamily: 'var(--serif)', fontWeight: 400,
         fontSize: '2.6em', color: 'var(--text)', lineHeight: 1.1,
       }}>
         Linguistics Knowledge Explorer
       </h1>
       <div style={{ width: 36, height: 2, background: '#333', margin: '12px auto', borderRadius: 1 }} />
       <p style={{ color: 'var(--text-3)', fontSize: '0.84em', letterSpacing: 0.5 }}>
         4 Dimensions &middot; {total} Intersections &middot; {filled} Populated ({Math.round(filled/total*100)}%)
       </p>
     </header>

     {/* ─── Axis Selectors ─── */}
     <div style={{
       display: 'flex', gap: 12, justifyContent: 'center',
       marginBottom: 28, flexWrap: 'wrap', alignItems: 'center',
     }}>
       <Sel label="Columns" value={xAxis} other={yAxis} onChange={v => sw('x',v)} />
       <button className="swap" onClick={() => { const t=xAxis; setXAxis(yAxis); setYAxis(t); setSelectedCell(null); setTick(k=>k+1); }}
         style={{ background:'#fff', borderRadius:'50%', width:34, height:34, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', fontSize:'0.9em', color:'var(--text-3)' }}
       >⇄</button>
       <Sel label="Rows" value={yAxis} other={xAxis} onChange={v => sw('y',v)} />
     </div>

     {/* ─── Matrix ─── */}
     <div className="scroll" style={{ overflowX: 'auto', paddingBottom: 20 }}>
       <div key={tick} style={{
         display: 'grid',
         gridTemplateColumns: `110px repeat(${xDim.items.length}, minmax(155px, 1fr))`,
         gridTemplateRows: `56px repeat(${yDim.items.length}, auto)`,
         gap: 6,
         minWidth: xDim.items.length * 165 + 110,
         padding: '16px 12px 12px',
         background: 'var(--board)',
         borderRadius: 16,
       }}>

         {/* Corner */}
         <div style={{
           display: 'flex', alignItems: 'flex-end', justifyContent: 'flex-end',
           paddingRight: 10, paddingBottom: 6,
           fontSize: '0.6em', color: 'var(--text-3)', lineHeight: 1.4,
           textAlign: 'right', fontWeight: 500,
         }}>
           <span>
             {yDim.label} ↓<br/>
             {xDim.label} →
           </span>
         </div>

         {/* Column headers */}
         {xDim.items.map(item => (
           <div key={item.id} style={{
             display: 'flex', flexDirection: 'column', alignItems: 'center',
             justifyContent: 'center', textAlign: 'center', gap: 1,
           }}>
             <span style={{
               fontSize: '0.72em', fontWeight: 700,
               textTransform: 'uppercase', letterSpacing: 1,
               color: item.color || 'var(--text)',
             }}>{item.name}</span>
             <span style={{
               fontSize: '0.6em', fontWeight: 500,
               color: 'var(--text-3)',
             }}>{item.zh}</span>
           </div>
         ))}

         {/* Rows */}
         {yDim.items.map((yItem, ri) => (
           <React.Fragment key={yItem.id}>
             {/* Row header */}
             <div style={{
               display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
               paddingRight: 12, textAlign: 'right', lineHeight: 1.35,
             }}>
               <span>
                 <span style={{
                   display:'inline-block', width: 4, height: 4, borderRadius: 1,
                   background: yItem.color || '#999', marginRight: 6, verticalAlign: 'middle',
                 }}/>
                 <span style={{
                   fontSize: '0.66em', fontWeight: 700,
                   color: yItem.color || 'var(--text)',
                 }}>{yItem.name}</span>
                 <br/>
                 <span style={{
                   fontSize: '0.56em', fontWeight: 500,
                   color: 'var(--text-3)', marginLeft: 10,
                 }}>{yItem.zh}</span>
               </span>
             </div>

             {/* Cells */}
             {xDim.items.map((xItem, ci) => {
               const cell = getCell(xItem.id, yItem.id);
               const key = `${xItem.id}+${yItem.id}`;
               const sel = selectedCell === key;
               const accent = yItem.color || xItem.color || '#666';
               const delay = (ri * xDim.items.length + ci) * 10;

               if (!cell) return (
                 <div key={key} className="cell" style={{
                   background: 'var(--empty-bg)', borderRadius: 10,
                   minHeight: 100, display: 'flex', alignItems: 'center',
                   justifyContent: 'center', opacity: 0.55,
                   animation: 'pop 0.3s ease both',
                   animationDelay: `${delay}ms`,
                 }}>
                   <div style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--border)' }} />
                 </div>
               );

               return (
                 <div key={key}
                   className={`cell filled ${sel ? 'selected' : ''}`}
                   onClick={() => setSelectedCell(sel ? null : key)}
                   style={{
                     '--ring': accent,
                     background: rgba(accent, 0.08),
                     borderRadius: 12,
                     padding: '14px 14px 12px',
                     minHeight: 118,
                     position: 'relative',
                     cursor: 'pointer',
                     display: 'flex', flexDirection: 'column',
                     boxShadow: sel ? undefined : `0 1px 4px ${rgba(accent, 0.08)}`,
                     animation: 'pop 0.3s ease both',
                     animationDelay: `${delay}ms`,
                   }}
                 >
                   {/* Title with dot */}
                   <div style={{ display: 'flex', alignItems: 'flex-start', gap: 7, marginBottom: 8 }}>
                     <span style={{
                       display: 'inline-block', width: 6, height: 6, borderRadius: '50%',
                       background: accent, flexShrink: 0, marginTop: 4,
                     }} />
                     <span style={{
                       fontSize: '0.82em', fontWeight: 700, lineHeight: 1.3,
                       color: 'var(--text)',
                     }}>{cell.title}</span>
                   </div>

                   {/* Description */}
                   <div style={{
                     fontSize: '0.7em', lineHeight: 1.6,
                     color: 'var(--text-2)', fontWeight: 400,
                     flex: 1,
                   }}>{cell.desc}</div>

                   {/* Scholars */}
                   {cell.fig && (
                     <div style={{
                       marginTop: 10, paddingTop: 8,
                       borderTop: `1px solid ${rgba(accent, 0.15)}`,
                       display: 'flex', alignItems: 'flex-start',
                       fontSize: '0.64em', color: accent,
                       lineHeight: 1.4,
                     }}>
                       <PersonIcon color={accent} />
                       <span style={{
                         fontFamily: 'var(--scholar)', fontStyle: 'italic',
                         fontWeight: 500,
                       }}>{cell.fig}</span>
                     </div>
                   )}
                 </div>
               );
             })}
           </React.Fragment>
         ))}
       </div>
     </div>

     {/* ─── Footer ─── */}
     <footer style={{
       maxWidth: 700, margin: '20px auto 0', paddingTop: 18,
       borderTop: '1px solid var(--border)',
       textAlign: 'center', lineHeight: 1.8,
     }}>
       <div style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: '1.05em', color: 'var(--text-2)' }}>
         Four Dimensions of Linguistic Knowledge
       </div>
       <div style={{ fontSize: '0.74em', color: 'var(--text-3)', letterSpacing: 0.3 }}>
         Micro-Level &middot; Interface Discipline &middot; Theoretical Framework &middot; Applied Context
       </div>
       <div style={{ fontSize: '0.68em', color: 'var(--text-4)' }}>
         C(4,2) = 6 unique views &mdash; switch axes above to explore
       </div>
       <div style={{ fontSize: '0.62em', color: 'var(--text-4)', marginTop: 12 }}>
         &copy; {new Date().getFullYear()} Tip &middot; All rights reserved
       </div>
     </footer>
   </div>
 );
}

function Sel({ label, value, other, onChange }) {
 return (
   <div style={{
     background: '#fff', borderRadius: 12,
     padding: '10px 14px', border: '1px solid var(--border)',
     minWidth: 190,
   }}>
     <div style={{
       fontSize: '0.58em', fontWeight: 700, color: 'var(--text-3)',
       marginBottom: 7, textTransform: 'uppercase', letterSpacing: 2,
     }}>{label}</div>
     <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
       {Object.entries(DIMENSIONS).map(([k, d]) => {
         const on = value === k;
         const off = k === other;
         return (
           <button key={k} className={`pill ${on ? 'on' : ''}`}
             onClick={() => onChange(k)} disabled={off}
             style={{
               padding: '4px 10px', borderRadius: 999,
               background: on ? 'var(--text)' : 'transparent',
               color: on ? '#fff' : off ? 'var(--text-4)' : 'var(--text-2)',
               fontSize: '0.7em', fontWeight: 600,
               cursor: off ? 'default' : 'pointer',
               opacity: off ? 0.3 : 1,
             }}
           >{d.labelZh}</button>
         );
       })}
     </div>
   </div>
 );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
